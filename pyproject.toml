[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-transcriber"
version = "0.1.0"
description = "Transcribe piano audio recordings to PDF sheet music."
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{ name = "Peter Guthrie" }]
dependencies = [
    "basic-pitch[onnx]>=0.4.0",
    "pretty_midi>=0.2.10",
    "music21>=9.1.0",
    "verovio>=4.0.0,<5.0",
    "cairosvg>=2.7.0",
    "pypdf>=4.0.0",
    "setuptools<81",
]

[project.optional-dependencies]
heavy = [
    "torch>=2.0",
    "piano-transcription-inference>=0.0.5",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
piano-transcribe = "piano_transcriber.cli:main"

[tool.setuptools.packages.find]
include = ["piano_transcriber*"]
exclude = ["tests*", "samples*"]
